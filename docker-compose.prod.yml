version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eleven11_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-eleven_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AtelierSecureProdPass2026!}
      POSTGRES_DB: ${DB_NAME:-eleven11_prod_db}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eleven_prod_user} -d ${DB_NAME:-eleven11_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eleven11_internal

  # -------------------------------------------------------------------
  # 2. Redis & BullMQ Queues
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eleven11_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-AtelierRedisSecurePass2026!}
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-AtelierRedisSecurePass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eleven11_internal

  # -------------------------------------------------------------------
  # 3. NestJS Modular Monolith API
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eleven11_prod_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-eleven_prod_user}:${DB_PASSWORD:-AtelierSecureProdPass2026!}@postgres:5432/${DB_NAME:-eleven11_prod_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-AtelierRedisSecurePass2026!}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT}
      SPACES_REGION: ${SPACES_REGION}
      SPACES_BUCKET: ${SPACES_BUCKET}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
    networks:
      - eleven11_internal

  # -------------------------------------------------------------------
  # 4. NestJS Worker (BullMQ Consumer)
  # -------------------------------------------------------------------
  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: eleven11_prod_workers
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-eleven_prod_user}:${DB_PASSWORD:-AtelierSecureProdPass2026!}@postgres:5432/${DB_NAME:-eleven11_prod_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-AtelierRedisSecurePass2026!}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    networks:
      - eleven11_internal

  # -------------------------------------------------------------------
  # 5. Next.js Luxury Storefront (Customer Facing)
  # -------------------------------------------------------------------
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: eleven11_prod_storefront
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-eleven11atelier.com}/api
    networks:
      - eleven11_internal

  # -------------------------------------------------------------------
  # 6. Next.js Admin Console (Internal Staff Facing)
  # -------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: eleven11_prod_admin
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-eleven11atelier.com}/api
    networks:
      - eleven11_internal

  # -------------------------------------------------------------------
  # 7. Nginx Reverse Proxy (Cloudflare Edge Gateway)
  # -------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: eleven11_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storefront
      - admin
      - api
    networks:
      - eleven11_internal

volumes:
  prod_postgres_data:
  prod_redis_data:

networks:
  eleven11_internal:
    driver: bridge
